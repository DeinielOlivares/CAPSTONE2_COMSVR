<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Barangay Platero OVRMS — Forgot Password</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="/shared/js/common.js"></script>
</head>
<body>

  <nav class="navbar">
    <div class="navbar__brand">
      <span class="navbar__logo" aria-hidden="true"></span>
      <div class="navbar__brand-text"><strong>Barangay Platero</strong><small>Ordinance Violation Reporting and Monitoring System</small></div>
    </div>
    <span class="navbar__portal-label">Barangay Staff Portal</span>
  </nav>

  <section class="plain-hero">
    <div class="auth-card auth-card--outline">
      <h1 class="auth-card__title">Forgot Password?</h1>
      <p class="auth-card__subtitle">Enter your registered email address and we'll send you a code to reset your password</p>
      <form data-goto="verify-code.html" data-forgot-request novalidate>
        <div class="field field--boxed">
          <label for="fpEmail">Email</label>
          <input type="email" id="fpEmail" name="email" placeholder="balamia@gmail.com" required />
        </div>
        <button type="submit" class="btn">Get Code</button>
      </form>
      <a class="form-back" href="index.html">Back to Log In</a>
    </div>
  </section>

  <script src="/shared/js/auth-pages.js"></script>
</body>
</html>
