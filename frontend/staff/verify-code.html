<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Barangay Platero OVRMS — Input Code</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="/shared/js/common.js"></script>
</head>
<body>

  <nav class="navbar">
    <div class="navbar__brand">
      <span class="navbar__logo" aria-hidden="true"></span>
      <div class="navbar__brand-text"><strong>Barangay Platero</strong><small>Ordinance Violation Reporting and Monitoring System</small></div>
    </div>
    <span class="navbar__portal-label">Barangay Staff Portal</span>
  </nav>

  <section class="plain-hero">
    <div class="auth-card auth-card--outline auth-card--narrow">
      <h1 class="auth-card__title">Input Code</h1>
      <p class="auth-card__subtitle">If an account exists for that email, we've sent it a 6-digit code. Enter it below.</p>
      <form data-goto="reset-password.html" data-forgot-verify novalidate>
        <div class="field field--boxed field--code">
          <label for="code">Code</label>
          <input type="text" id="code" name="code" inputmode="numeric" placeholder="XXXXXX" maxlength="6" required />
        </div>
        <button type="submit" class="btn">Enter</button>
      </form>
      <a class="form-back" href="index.html">Back to Log In</a>
    </div>
  </section>

  <script src="/shared/js/auth-pages.js"></script>
</body>
</html>
