<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Barangay Platero OVRMS — Reset Password</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="/shared/js/common.js"></script>
</head>
<body>

  <nav class="navbar">
    <div class="navbar__brand">
      <span class="navbar__logo" aria-hidden="true"></span>
      <div class="navbar__brand-text"><strong>Barangay Platero</strong><small>Ordinance Violation Reporting and Monitoring System</small></div>
    </div>
    <span class="navbar__portal-label">Barangay Staff Portal</span>
  </nav>

  <section class="plain-hero">
    <div class="auth-card auth-card--outline">
      <h1 class="auth-card__title">Reset Password</h1>
      <form data-goto="reset-success.html" data-forgot-confirm novalidate>
        <div class="field field--boxed">
          <label for="newPassword">Input New Password</label>
          <input type="password" id="newPassword" name="password" placeholder="XXXXXX" required />
        </div>
        <div class="field field--boxed">
          <label for="confirmNewPassword">Confirm New Password</label>
          <input type="password" id="confirmNewPassword" name="confirmPassword" placeholder="XXXXXX" required />
        </div>
        <button type="submit" class="btn">Reset Password</button>
      </form>
      <a class="form-back" href="index.html">Back to Log In</a>
    </div>
  </section>

  <script src="/shared/js/auth-pages.js"></script>
</body>
</html>
