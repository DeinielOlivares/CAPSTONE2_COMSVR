<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Barangay Platero OVRMS — Login</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="/shared/js/common.js"></script>
</head>
<body>

  <nav class="navbar">
    <div class="navbar__brand">
      <span class="navbar__logo" aria-hidden="true"></span>
      <div class="navbar__brand-text"><strong>Barangay Platero</strong><small>Ordinance Violation Reporting and Monitoring System</small></div>
    </div>
    <span class="navbar__portal-label">Barangay Staff Portal</span>
  </nav>

  <section class="hero">
    <div class="auth-card">
      <h1 class="auth-card__title">Login</h1>
      <form data-goto="reports-dashboard.html" data-login novalidate>
        <div class="field">
          <label for="loginEmail">Email</label>
          <input type="text" id="loginEmail" name="email" inputmode="email" autocomplete="username" placeholder="bob.marley@gmail.com" required />
        </div>
        <div class="field">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" name="password" placeholder="Enter your password..." />
        </div>
        <div class="form-links">
          <label class="remember-me-check">
            <input type="checkbox" id="rememberMe" name="rememberMe" />
            Stay signed in
          </label>
          <a href="forgot-password.html">Forgot Password?</a>
        </div>
        <button type="submit" class="btn">Login Now</button>
      </form>
      <p class="form-footer">
        <a href="account-setup.html">First time here? Set up your account</a>
      </p>
    </div>
  </section>

  <script src="/shared/js/auth-pages.js"></script>

  <script>
    // Landing on the login page always starts a fresh, logged-out session.
    logOut();
  </script>
</body>
</html>
